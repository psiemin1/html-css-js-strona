<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookHub</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar">
  <div class="navbar__container">
    <a href="/" id="navbar__logo">BookHub</a>

    <div class="navbar__toggle" id="mobile-menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>

    <ul class="navbar__menu">
      <li class="navbar__item">
        <a href="/" class="navbar__links">Strona główna</a>
      </li>

      <li class="navbar__item">
        <a href="/kup.html" class="navbar__links">Kup</a>
      </li>

      <li class="navbar__item">
        <a href="/ulubione.html" class="navbar__links">Ulubione</a>
      </li>

      <li class="navbar__item">
        <a href="/sprzedaj.html" class="navbar__links">Sprzedaj</a>
      </li>

      <!-- JEDYNY ELEMENT ZMIENIANY PRZEZ JS -->
      <li class="navbar__item" id="auth-item">
        <a href="/login.html" class="navbar__links" id="auth-link">
          Zaloguj się
        </a>
      </li>
    </ul>
  </div>
</nav>

    <!-- HERO -->
    <div class="main">
      <div class="main__container">
        <div class="main__content">
          <h1>BookHub</h1>
          <p>Kupuj i sprzedawaj książki w jednym miejscu.</p>

          <button class="main__btn">
            <a href="/kup.html">Przeglądaj</a>
          </button>
        </div>

        <div class="main__img--container">
          <img id="main__img" src="images/pic1.svg" alt="Books" />
        </div>
        <button class="main__btn main__btn--secondary" id="scroll-services">
        Zobacz więcej
        </button>
      </div>
    </div>

    <!-- SERVICES -->
    <div class="services" id="services">
      <h1>Tysiące książek – jedna platforma</h1>

      <div class="services__container">
        <div class="services__card">
          <h2>Bestsellery</h2>
          <p>Musisz to przeczytać!</p>
          <button onclick="location.href='/kup.html'">Przejdź</button>
        </div>

        <div class="services__card">
          <h2>Promocje</h2>
          <p>Złap okazję!</p>
          <button onclick="location.href='/kup.html'">Przejdź</button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer__container">
      <p class="website__rights">
        © 2026 BookHub. Wszelkie prawa zastrzeżone.
      </p>
    </footer>

    <!-- Scripts -->
    <script src="app.js"></script>
    <script type="module" src="firebase.js"></script>
    <script type="module" src="auth.js"></script>
  </body>
</html>
